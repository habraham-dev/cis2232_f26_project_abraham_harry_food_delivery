<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/head :: headerFragment">
    <title id="pageTitle">Performance Hall Administration</title>
</head>
<body>
<nav th:replace="fragments/navHeader :: navbar"></nav>
<div class="container centered2">
    <h2 class="title is-2"><span th:text="#{label.welcome.to}"></span> <span th:text="#{application.name}"></span></h2>
    <h3 class="title is-2"><span th:text="#{label.choose.organization}"></span></h3>
</div>

<div class="container centered2">
    <table>
        <tr th:each="current,iterStat : ${session.organizationCodes}">
            <td>
                <a th:href="@{/start/{organization}(organization=${current.id})}">
                    <span class="large" text="" th:text="${current.englishDescription}"></span>
                </a>
            </td>
        </tr>
    </table>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
